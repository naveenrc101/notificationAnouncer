name: Build Android APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Published APKs must keep the same signing certificate across runs.
      # Store the local .android/debug.keystore as an Actions secret; never commit it.
      - name: Restore VaaniPing signing key
        if: github.event_name != 'pull_request'
        env:
          VAANIPING_DEBUG_KEYSTORE_B64: ${{ secrets.VAANIPING_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$VAANIPING_DEBUG_KEYSTORE_B64" ]; then
            echo "Missing VAANIPING_DEBUG_KEYSTORE_B64 repository secret"
            exit 1
          fi
          umask 077
          signing_key="$RUNNER_TEMP/vaaniping-debug.keystore"
          printf '%s' "$VAANIPING_DEBUG_KEYSTORE_B64" | base64 --decode > "$signing_key"
          actual="$(keytool -list -v -keystore "$signing_key" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="eeb7cca720e59383206842d1d01d225350c0513e1a7fbdd47fc761b9cede1e39"
          if [ "$actual" != "$expected" ]; then
            echo "VaaniPing signing certificate does not match the established key"
            exit 1
          fi
          echo "VAANIPING_SIGNING_KEYSTORE=$signing_key" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Creates a GitHub Release with the APK attached when you push a version tag
      # Usage: git tag v1.0 && git push origin v1.0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
